services:
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    container_name: kafka-lab-broker
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kafka-lab-app
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_PORT: 8080
      MESSAGES: ${MESSAGES:-1000000}
      PARTITIONS: ${PARTITIONS:-24}
      CONCURRENCY: ${CONCURRENCY:-1}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      PRODUCER_BATCH_BYTES: ${PRODUCER_BATCH_BYTES:-65536}
      GENERATOR_THREADS: ${GENERATOR_THREADS:-4}
      PAYLOAD_BYTES: ${PAYLOAD_BYTES:-1024}
      DELIVERY_MODE: ${DELIVERY_MODE:-AT_LEAST_ONCE}
      WORKLOAD: ${WORKLOAD:-LIGHT}
      COMPRESSION_TYPE: ${COMPRESSION_TYPE:-none}
      LINGER_MS: ${LINGER_MS:-5}
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: kafka-lab-prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml","--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.6.0
    container_name: kafka-lab-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
volumes:
  kafka-data:
  prometheus-data:
  grafana-data:
