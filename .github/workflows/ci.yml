name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven launcher executable
        run: chmod +x mvnw
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Inspect Docker runtime
        run: docker version
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Start Kafka and application
        run: docker compose up -d --build kafka app
      - name: Wait for application health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: End-to-end Kafka smoke test
        run: |
          run_id="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker compose run --rm --no-deps -e LAB_CONSUMER_ENABLED=false app \
            --spring.main.web-application-type=none --lab.consumer.enabled=false --generate \
            --messages=100 --run-id="${run_id}"
          docker compose run --rm --no-deps -e LAB_CONSUMER_ENABLED=false app \
            --spring.main.web-application-type=none --lab.consumer.enabled=false --validate \
            --run-id="${run_id}" --messages=100 --timeout-seconds=120
      - name: Stop Kafka stack
        if: always()
        run: docker compose down -v
