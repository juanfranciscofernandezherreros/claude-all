name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven launcher executable
        run: chmod +x mvnw
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Inspect Docker runtime
        run: docker version
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Prepare benchmark results directory
        run: mkdir -p benchmark-results && chmod 777 benchmark-results
      - name: Start Kafka and application
        run: docker compose up -d --build kafka app
      - name: Wait for application health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: End-to-end benchmark smoke test
        run: |
          scenario="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/run-scenario.sh "${scenario}" 100 1 1024 LIGHT AT_LEAST_ONCE
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with open("benchmark-results/results.csv", newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 3, f"expected 3 repetitions, got {len(rows)}"
          for row in rows:
              assert row["status"] == "PASS", row
              folder = Path("benchmark-results") / row["runId"]
              for name in ("offsets.json", "execution.log", "validation.json", "summary.json", "environment.json", "report.md"):
                  assert (folder / name).is_file(), f"missing {folder / name}"
              report = json.loads((folder / "validation.json").read_text(encoding="utf-8"))
              assert report["status"] == "PASS" and report["processingComplete"] is True
          print("3 benchmark repetitions passed; all six artifacts present.")
          PY
      - name: Stop Kafka stack
        if: always()
        run: docker compose down -v
