name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Make Maven launcher executable
        run: chmod +x mvnw
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Verify generated files are ignored
        run: |
          mkdir -p target benchmark-results/run-check kafka-data
          touch target/classes.tmp .env benchmark-results/run-check/execution.log
          touch benchmark-results/run-check/offsets.json benchmark-results/run-check/resource-samples.json
          touch benchmark-results/run-check/prometheus-metrics.txt kafka-data/segment.log
          for path in target/classes.tmp .env benchmark-results/run-check/execution.log benchmark-results/run-check/offsets.json benchmark-results/run-check/resource-samples.json benchmark-results/run-check/prometheus-metrics.txt kafka-data/segment.log; do
            git check-ignore -q "$path" || { echo "Expected ignored path: $path"; exit 1; }
          done
          if git check-ignore -q .env.example; then echo ".env.example must remain trackable"; exit 1; fi
      - name: Test stress stop policy
        run: |
          python3 -m py_compile scripts/stress_runner.py scripts/stress_policy.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Validate benchmark scenario matrix
        run: |
          bash scripts/run-full-suite.sh --dry-run > /tmp/benchmark-matrix.json
          python3 - <<'PY'
          import json
          matrix = json.load(open("/tmp/benchmark-matrix.json", encoding="utf-8"))
          assert matrix["main"]["messages"] == 1_000_000
          assert matrix["main"]["concurrencies"] == [1, 2, 5, 10, 20]
          assert matrix["main"]["warmupMessages"] == 10_000
          assert matrix["main"]["repetitions"] == 3
          assert [x["payloadBytes"] for x in matrix["payload"]] == [1024, 5120, 10240, 51200, 102400]
          assert [x["workload"] for x in matrix["workload"]] == ["LIGHT", "MEDIUM", "HEAVY"]
          assert [x["deliveryMode"] for x in matrix["delivery"]] == ["AT_LEAST_ONCE", "EXACTLY_ONCE"]
          assert all(x["messages"] == 100_000 and x["concurrency"] == 5 and x["repetitions"] == 3
                     for key in ("payload", "workload", "delivery") for x in matrix[key])
          print("Benchmark matrix matches PRD: 5 payload, 3 workload, 2 delivery scenarios.")
          PY
      - name: Validate million-message delivery comparison matrix
        run: |
          bash scripts/run-delivery-comparison.sh --dry-run > /tmp/delivery-comparison.json
          python3 - <<'PY'
          import json
          matrix = json.load(open("/tmp/delivery-comparison.json", encoding="utf-8"))
          assert matrix["messagesPerRun"] == 1_000_000
          assert matrix["concurrency"] == 10
          assert matrix["repetitionsPerMode"] == 3
          assert matrix["deliveryModes"] == ["AT_LEAST_ONCE", "EXACTLY_ONCE"]
          assert matrix["batchSize"] == 1000
          assert matrix["producerBatchBytes"] == 131072
          assert matrix["compression"] == "lz4"
          print("Million-message delivery comparison matrix validated.")
          PY
      - name: Validate stress runner defaults
        run: |
          bash scripts/run-stress.sh --dry-run > /tmp/stress-matrix.json
          python3 - <<'PY'
          import json
          stress = json.load(open("/tmp/stress-matrix.json", encoding="utf-8"))
          assert stress["maxMessages"] == 5_000_000
          assert stress["stepMessages"] == 100_000
          assert stress["concurrency"] == 20
          assert stress["payloadBytes"] == 102400
          assert stress["workload"] == "HEAVY"
          assert stress["deliveryMode"] == "EXACTLY_ONCE"
          assert stress["warmupMessages"] == 10_000
          assert stress["repetitionsPerStep"] == 1
          assert stress["stopConditions"]["memoryPercent"] == ">85"
          assert stress["stopConditions"]["consumerLag"] == "increasing for 3 consecutive steps"
          print("Incremental stress defaults and stop conditions validated.")
          PY
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Inspect Docker runtime
        run: docker version
      - name: Verify
        run: ./mvnw -B clean verify
      - name: Prepare benchmark results directory
        run: mkdir -p benchmark-results && chmod 777 benchmark-results
      - name: Start Kafka and application
        run: docker compose up -d --build kafka app prometheus grafana
      - name: Wait for application health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1
      - name: Verify Kafka external listener, restart and topic idempotence
        run: |
          docker run --rm --network host apache/kafka:3.9.1 \
            /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092 > /tmp/topics-before.txt
          for topic in input-topic output-topic input-dlt-topic; do grep -Fxq "$topic" /tmp/topics-before.txt; done
          docker compose restart kafka
          for attempt in {1..60}; do
            if docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092 > /tmp/topics-after-broker-restart.txt
          for topic in input-topic output-topic input-dlt-topic; do grep -Fxq "$topic" /tmp/topics-after-broker-restart.txt; done
          docker compose restart app
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/actuator/health
          docker compose exec -T kafka /opt/kafka/bin/kafka-topics.sh --list --bootstrap-server kafka:9092 > /tmp/topics-after-app-restart.txt
          for topic in input-topic output-topic input-dlt-topic; do grep -Fxq "$topic" /tmp/topics-after-app-restart.txt; done
          docker run --rm --network host apache/kafka:3.9.1 \
            /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094
      - name: Verify Prometheus and Grafana provisioning
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:9090/-/ready >/dev/null && \
               curl --fail --silent http://localhost:3000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl --fail --silent http://localhost:9090/-/ready
          curl --fail --silent http://localhost:3000/api/health
          curl --fail --silent -u admin:admin http://localhost:3000/api/datasources > /tmp/grafana-datasources.json
          curl --fail --silent -u admin:admin -G --data-urlencode "query=Kafka Performance Lab" \
            http://localhost:3000/api/search > /tmp/grafana-dashboards.json
          python3 - <<'PY'
          import json
          datasources = json.load(open("/tmp/grafana-datasources.json", encoding="utf-8"))
          dashboards = json.load(open("/tmp/grafana-dashboards.json", encoding="utf-8"))
          assert any(item["name"] == "Prometheus" and item["url"] == "http://prometheus:9090"
                     for item in datasources), datasources
          assert any(item.get("uid") == "kafka-performance-lab" for item in dashboards), dashboards
          print("Prometheus datasource and Kafka Performance Lab dashboard are provisioned.")
          PY
      - name: End-to-end benchmark smoke test
        run: |
          scenario="ci-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          WARMUP_MESSAGES=100 bash scripts/run-scenario.sh "${scenario}" 100 1 1024 LIGHT AT_LEAST_ONCE
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          with open("benchmark-results/results.csv", newline="", encoding="utf-8") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == 3, f"expected 3 repetitions, got {len(rows)}"
          for row in rows:
              assert row["status"] == "PASS", row
              folder = Path("benchmark-results") / row["runId"]
              for name in ("offsets.json", "execution.log", "validation.json", "summary.json", "environment.json", "report.md", "prometheus-metrics.txt", "resource-samples.tsv", "resource-samples.json"):
                  assert (folder / name).is_file(), f"missing {folder / name}"
              report = json.loads((folder / "validation.json").read_text(encoding="utf-8"))
              assert report["status"] == "PASS" and report["processingComplete"] is True
              environment = json.loads((folder / "environment.json").read_text(encoding="utf-8"))
              for metric in ("memoryBytes", "memoryPercentMax", "heapUsedBytes", "gcPauseCount", "gcPauseSeconds", "kafkaConsumerLag"):
                  assert environment[metric] is not None, f"missing environment metric {metric}: {environment}"
              assert environment["resourceSampleCount"] >= 1, environment
              samples = json.loads((folder / "resource-samples.json").read_text(encoding="utf-8"))
              assert len(samples) == environment["resourceSampleCount"]
          print("3 benchmark repetitions passed; all artifacts and periodic resource samples present.")
          PY
      - name: Stop Kafka stack
        if: always()
        run: docker compose down -v
