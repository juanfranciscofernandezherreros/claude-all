server:
  port: ${APP_PORT:8080}
spring:
  application:
    name: kafka-performance-lab
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 2147483647
      batch-size: ${PRODUCER_BATCH_BYTES:65536}
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: ${LINGER_MS:5}
        compression.type: ${COMPRESSION_TYPE:none}
    consumer:
      group-id: kafka-lab
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: ${BATCH_SIZE:500}
      isolation-level: ${KAFKA_ISOLATION_LEVEL:read_committed}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: manual
      concurrency: ${CONCURRENCY:1}
  lifecycle:
    timeout-per-shutdown-phase: 30s
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
lab:
  messages: ${MESSAGES:1000000}
  partitions: ${PARTITIONS:24}
  concurrency: ${CONCURRENCY:1}
  batch-size: ${BATCH_SIZE:500}
  producer-batch-bytes: ${PRODUCER_BATCH_BYTES:65536}
  generator-threads: ${GENERATOR_THREADS:4}
  payload-bytes: ${PAYLOAD_BYTES:1024}
  delivery-mode: ${DELIVERY_MODE:AT_LEAST_ONCE}
  workload: ${WORKLOAD:LIGHT}
  input-topic: input-topic
  output-topic: output-topic
  dlt-topic: input-dlt-topic
